name: ${COMPOSE_PROJECT_NAME:-wavy-recette}

services:
  wavy-erp-shell-recette:
    container_name: wavy-erp-shell-recette
    image: ${WAVY_IMAGE_REGISTRY}/wavy-erp-shell:${ERP_SHELL_VERSION}
    ports:
      - "${WAVY_ERP_SHELL_HOST_PORT:-24207}:80"
    environment:
      NGINX_ENVSUBST_FILTER: _UPSTREAM$
      API_UPSTREAM: http://wavy-gateway-recette:8088
      SOCLE_FRONT_UPSTREAM: http://wavy-socle-front-recette/
      TIERS_FRONT_UPSTREAM: http://wavy-tiers-front-recette/
      CONTRATS_FRONT_UPSTREAM: http://wavy-contrats-front-recette/
      FACTURES_FRONT_UPSTREAM: http://wavy-factures-front-recette/
      TRESORERIE_FRONT_UPSTREAM: http://wavy-tresorerie-front-recette/
    depends_on:
      wavy-gateway-recette:
        condition: service_started
      wavy-socle-front-recette:
        condition: service_started
      wavy-tiers-front-recette:
        condition: service_started
      wavy-contrats-front-recette:
        condition: service_started
      wavy-factures-front-recette:
        condition: service_started
      wavy-tresorerie-front-recette:
        condition: service_started
    networks:
      - wavy-recette

  socle-postgres:
    image: postgres:16-alpine
    container_name: socle-db-recette
    environment:
      POSTGRES_DB: ${WAVY_SOCLE_DB_NAME:-wavy_socle_db}
      POSTGRES_USER: ${WAVY_SOCLE_DB_USERNAME:-socle_user}
      POSTGRES_PASSWORD: ${WAVY_SOCLE_DB_PASSWORD:-motdepasse_recette}
    ports:
      - "${WAVY_SOCLE_DB_HOST_PORT:-25432}:5432"
    volumes:
      - socle-postgres-recette-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAVY_SOCLE_DB_USERNAME:-socle_user} -d ${WAVY_SOCLE_DB_NAME:-wavy_socle_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wavy-recette

  tiers-postgres:
    image: postgres:16-alpine
    container_name: tiers-db-recette
    environment:
      POSTGRES_DB: ${WAVY_TIERS_DB_NAME:-wavy_tiers_db}
      POSTGRES_USER: ${WAVY_TIERS_DB_USER:-tiers_user}
      POSTGRES_PASSWORD: ${WAVY_TIERS_DB_PASSWORD:-motdepasse_recette}
    ports:
      - "${WAVY_TIERS_DB_HOST_PORT:-25433}:5432"
    volumes:
      - tiers-postgres-recette-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAVY_TIERS_DB_USER:-tiers_user} -d ${WAVY_TIERS_DB_NAME:-wavy_tiers_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wavy-recette

  contrats-postgres:
    image: postgres:16-alpine
    container_name: contrats-db-recette
    environment:
      POSTGRES_DB: ${WAVY_CONTRATS_DB_NAME:-wavy_contrats_db}
      POSTGRES_USER: ${WAVY_CONTRATS_DB_USER:-contrats_user}
      POSTGRES_PASSWORD: ${WAVY_CONTRATS_DB_PASSWORD:-motdepasse_recette}
    ports:
      - "${WAVY_CONTRATS_DB_HOST_PORT:-25434}:5432"
    volumes:
      - contrats-postgres-recette-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAVY_CONTRATS_DB_USER:-contrats_user} -d ${WAVY_CONTRATS_DB_NAME:-wavy_contrats_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wavy-recette

  factures-postgres:
    image: postgres:16-alpine
    container_name: factures-db-recette
    environment:
      POSTGRES_DB: ${WAVY_FACTURES_DB_NAME:-wavy_factures_db}
      POSTGRES_USER: ${WAVY_FACTURES_DB_USER:-factures_user}
      POSTGRES_PASSWORD: ${WAVY_FACTURES_DB_PASSWORD:-motdepasse_recette}
    ports:
      - "${WAVY_FACTURES_DB_HOST_PORT:-25435}:5432"
    volumes:
      - factures-postgres-recette-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAVY_FACTURES_DB_USER:-factures_user} -d ${WAVY_FACTURES_DB_NAME:-wavy_factures_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wavy-recette

  tresorerie-postgres:
    image: postgres:16-alpine
    container_name: tresorerie-db-recette
    environment:
      POSTGRES_DB: ${WAVY_TRESORERIE_DB_NAME:-wavy_tresorerie_db}
      POSTGRES_USER: ${WAVY_TRESORERIE_DB_USER:-tresorerie_user}
      POSTGRES_PASSWORD: ${WAVY_TRESORERIE_DB_PASSWORD:-motdepasse_recette}
    ports:
      - "${WAVY_TRESORERIE_DB_HOST_PORT:-25436}:5432"
    volumes:
      - tresorerie-postgres-recette-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAVY_TRESORERIE_DB_USER:-tresorerie_user} -d ${WAVY_TRESORERIE_DB_NAME:-wavy_tresorerie_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wavy-recette

  wavy-socle-api-recette:
    container_name: wavy-socle-api-recette
    image: ${WAVY_IMAGE_REGISTRY}/wavy-socle-api:${SOCLE_API_VERSION}
    environment:
      SPRING_PROFILES_ACTIVE: ${WAVY_SOCLE_SPRING_PROFILES_ACTIVE:-local}
      WAVY_SOCLE_DB_HOST: socle-db-recette
      WAVY_SOCLE_DB_PORT: 5432
      WAVY_SOCLE_DB_NAME: ${WAVY_SOCLE_DB_NAME:-wavy_socle_db}
      WAVY_SOCLE_DB_USERNAME: ${WAVY_SOCLE_DB_USERNAME:-socle_user}
      WAVY_SOCLE_DB_USER: ${WAVY_SOCLE_DB_USERNAME:-socle_user}
      WAVY_SOCLE_DB_PASSWORD: ${WAVY_SOCLE_DB_PASSWORD:-motdepasse_recette}
      WAVY_SOCLE_DB_URL: jdbc:postgresql://socle-db-recette:5432/${WAVY_SOCLE_DB_NAME:-wavy_socle_db}
      WAVY_SOCLE_API_PORT: 8080
      WAVY_TIERS_API_URL: ${WAVY_TIERS_API_URL:-http://wavy-tiers-api-recette:8081}
      WAVY_TIERS_SERVICE_USERNAME: ${WAVY_TIERS_SERVICE_USERNAME}
      WAVY_TIERS_SERVICE_PASSWORD: ${WAVY_TIERS_SERVICE_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://socle-db-recette:5432/${WAVY_SOCLE_DB_NAME:-wavy_socle_db}
      SPRING_DATASOURCE_USERNAME: ${WAVY_SOCLE_DB_USERNAME:-socle_user}
      SPRING_DATASOURCE_PASSWORD: ${WAVY_SOCLE_DB_PASSWORD:-motdepasse_recette}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    ports:
      - "${WAVY_SOCLE_API_HOST_PORT:-28080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      socle-postgres:
        condition: service_healthy
      wavy-tiers-api-recette:
        condition: service_healthy
    networks:
      - wavy-recette

  wavy-tiers-api-recette:
    container_name: wavy-tiers-api-recette
    image: ${WAVY_IMAGE_REGISTRY}/wavy-tiers-api:${TIERS_API_VERSION}
    environment:
      SPRING_PROFILES_ACTIVE: ${WAVY_TIERS_SPRING_PROFILES_ACTIVE:-recette}
      WAVY_TIERS_DB_HOST: tiers-db-recette
      WAVY_TIERS_DB_PORT: 5432
      WAVY_TIERS_DB_NAME: ${WAVY_TIERS_DB_NAME:-wavy_tiers_db}
      WAVY_TIERS_DB_USER: ${WAVY_TIERS_DB_USER:-tiers_user}
      WAVY_TIERS_DB_USERNAME: ${WAVY_TIERS_DB_USER:-tiers_user}
      WAVY_TIERS_DB_PASSWORD: ${WAVY_TIERS_DB_PASSWORD:-motdepasse_recette}
      WAVY_TIERS_API_PORT: 8081
      WAVY_TIERS_SERVICE_USERNAME: ${WAVY_TIERS_SERVICE_USERNAME}
      WAVY_TIERS_SERVICE_PASSWORD: ${WAVY_TIERS_SERVICE_PASSWORD}
    ports:
      - "${WAVY_TIERS_API_HOST_PORT:-28081}:8081"
    depends_on:
      tiers-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - wavy-recette

  wavy-contrats-api-recette:
    container_name: wavy-contrats-api-recette
    build:
      context: ../wavy-contrats-api
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${WAVY_CONTRATS_SPRING_PROFILES_ACTIVE:-recette}
      WAVY_CONTRATS_DB_HOST: contrats-db-recette
      WAVY_CONTRATS_DB_PORT: 5432
      WAVY_CONTRATS_DB_NAME: ${WAVY_CONTRATS_DB_NAME:-wavy_contrats_db}
      WAVY_CONTRATS_DB_USER: ${WAVY_CONTRATS_DB_USER:-contrats_user}
      WAVY_CONTRATS_DB_USERNAME: ${WAVY_CONTRATS_DB_USER:-contrats_user}
      WAVY_CONTRATS_DB_PASSWORD: ${WAVY_CONTRATS_DB_PASSWORD:-motdepasse_recette}
      WAVY_CONTRATS_API_PORT: 8082
      WAVY_CONTRATS_STOCKAGE_PIECES_JOINTES: /app/data/contrats/pieces-jointes
    ports:
      - "${WAVY_CONTRATS_API_HOST_PORT:-28082}:8082"
    volumes:
      - contrats-pieces-jointes-recette:/app/data/contrats/pieces-jointes
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      contrats-postgres:
        condition: service_healthy
    networks:
      - wavy-recette

  wavy-factures-api-recette:
    container_name: wavy-factures-api-recette
    image: ${WAVY_IMAGE_REGISTRY}/wavy-factures-api:${FACTURES_API_VERSION}
    environment:
      SPRING_PROFILES_ACTIVE: ${WAVY_FACTURES_SPRING_PROFILES_ACTIVE:-recette}
      WAVY_FACTURES_DB_HOST: factures-db-recette
      WAVY_FACTURES_DB_PORT: 5432
      WAVY_FACTURES_DB_NAME: ${WAVY_FACTURES_DB_NAME:-wavy_factures_db}
      WAVY_FACTURES_DB_USER: ${WAVY_FACTURES_DB_USER:-factures_user}
      WAVY_FACTURES_DB_USERNAME: ${WAVY_FACTURES_DB_USER:-factures_user}
      WAVY_FACTURES_DB_PASSWORD: ${WAVY_FACTURES_DB_PASSWORD:-motdepasse_recette}
      WAVY_FACTURES_API_PORT: 8083
      WAVY_TIERS_API_URL: http://wavy-tiers-api-recette:8081
      WAVY_CONTRATS_API_URL: http://wavy-contrats-api-recette:8082
      WAVY_SOCLE_API_URL: http://wavy-socle-api-recette:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://factures-db-recette:5432/${WAVY_FACTURES_DB_NAME:-wavy_factures_db}
      SPRING_DATASOURCE_USERNAME: ${WAVY_FACTURES_DB_USER:-factures_user}
      SPRING_DATASOURCE_PASSWORD: ${WAVY_FACTURES_DB_PASSWORD:-motdepasse_recette}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      WAVY_AI_PROVIDER: ${WAVY_AI_PROVIDER:-anthropic}
      WAVY_AI_MODEL: ${WAVY_AI_MODEL:-}
      WAVY_AI_API_KEY: ${WAVY_AI_API_KEY:-}
      WAVY_AI_TIMEOUT_SECONDS: ${WAVY_AI_TIMEOUT_SECONDS:-60}
      WAVY_AI_MAX_FILE_SIZE_MB: ${WAVY_AI_MAX_FILE_SIZE_MB:-10}
      WAVY_AI_ACHAT_AUTO_CREATION_ENABLED: ${WAVY_AI_ACHAT_AUTO_CREATION_ENABLED:-true}
      WAVY_AI_ACHAT_MINIMUM_CONFIDENCE: ${WAVY_AI_ACHAT_MINIMUM_CONFIDENCE:-0.90}
      WAVY_CORS_ALLOWED_ORIGIN_PATTERNS: ${WAVY_CORS_ALLOWED_ORIGIN_PATTERNS:-}
    ports:
      - "${WAVY_FACTURES_API_HOST_PORT:-28083}:8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      factures-postgres:
        condition: service_healthy
      wavy-socle-api-recette:
        condition: service_started
    networks:
      - wavy-recette

  wavy-tresorerie-api-recette:
    container_name: wavy-tresorerie-api-recette
    image: ${WAVY_IMAGE_REGISTRY}/wavy-tresorerie-api:${TRESORERIE_API_VERSION}
    environment:
      SPRING_PROFILES_ACTIVE: ${WAVY_TRESORERIE_SPRING_PROFILES_ACTIVE:-recette}
      WAVY_TRESORERIE_DB_HOST: tresorerie-db-recette
      WAVY_TRESORERIE_DB_PORT: 5432
      WAVY_TRESORERIE_DB_NAME: ${WAVY_TRESORERIE_DB_NAME:-wavy_tresorerie_db}
      WAVY_TRESORERIE_DB_USER: ${WAVY_TRESORERIE_DB_USER:-tresorerie_user}
      WAVY_TRESORERIE_DB_PASSWORD: ${WAVY_TRESORERIE_DB_PASSWORD:-motdepasse_recette}
      WAVY_TRESORERIE_API_PORT: 8086
      WAVY_FACTURES_API_URL: http://wavy-factures-api-recette:8083
      WAVY_TIERS_API_URL: http://wavy-tiers-api-recette:8081
      WAVY_CORS_ALLOWED_ORIGIN_PATTERNS: ${WAVY_CORS_ALLOWED_ORIGIN_PATTERNS:-}
    ports:
      - "${WAVY_TRESORERIE_API_HOST_PORT:-28086}:8086"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      tresorerie-postgres:
        condition: service_healthy
      wavy-factures-api-recette:
        condition: service_started
      wavy-tiers-api-recette:
        condition: service_healthy
    networks:
      - wavy-recette

  wavy-gateway-recette:
    container_name: wavy-gateway-recette
    image: ${WAVY_IMAGE_REGISTRY}/wavy-gateway:${GATEWAY_VERSION}
    environment:
      SPRING_PROFILES_ACTIVE: ${WAVY_GATEWAY_SPRING_PROFILES_ACTIVE:-recette}
      WAVY_GATEWAY_PORT: 8088
      WAVY_ROUTES_SOCLE_URI: http://wavy-socle-api-recette:8080
      WAVY_TIERS_API_URI: http://wavy-tiers-api-recette:8081
      WAVY_CONTRATS_API_URI: http://wavy-contrats-api-recette:8082
      WAVY_FACTURES_API_URL: http://wavy-factures-api-recette:8083
      WAVY_TRESORERIE_API_URL: http://wavy-tresorerie-api-recette:8086
      WAVY_CORS_ALLOWED_ORIGIN_PATTERNS: ${WAVY_CORS_ALLOWED_ORIGIN_PATTERNS:-}
    ports:
      - "${WAVY_GATEWAY_HOST_PORT:-28088}:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      wavy-socle-api-recette:
        condition: service_started
      wavy-tiers-api-recette:
        condition: service_started
      wavy-contrats-api-recette:
        condition: service_started
      wavy-factures-api-recette:
        condition: service_started
      wavy-tresorerie-api-recette:
        condition: service_started
    networks:
      wavy-recette:
        aliases: [wavy-gateway]

  wavy-socle-front-recette:
    container_name: wavy-socle-front-recette
    image: ${WAVY_IMAGE_REGISTRY}/wavy-socle-front:${SOCLE_FRONT_VERSION}
    environment:
      API_UPSTREAM: http://wavy-gateway-recette:8088
      SOCLE_API_UPSTREAM: http://wavy-socle-api-recette:8080
    ports:
      - "${WAVY_SOCLE_FRONT_HOST_PORT:-24200}:80"
    depends_on:
      wavy-gateway-recette:
        condition: service_started
    networks:
      wavy-recette:
        aliases: [wavy-socle-front]

  wavy-tiers-front-recette:
    container_name: wavy-tiers-front-recette
    image: ${WAVY_IMAGE_REGISTRY}/wavy-tiers-front:${TIERS_FRONT_VERSION}
    ports:
      - "${WAVY_TIERS_FRONT_HOST_PORT:-24201}:80"
    depends_on:
      wavy-gateway-recette:
        condition: service_started
    networks:
      wavy-recette:
        aliases: [wavy-tiers-front]

  wavy-contrats-front-recette:
    container_name: wavy-contrats-front-recette
    image: ${WAVY_IMAGE_REGISTRY}/wavy-contrats-front:${CONTRATS_FRONT_VERSION}
    ports:
      - "${WAVY_CONTRATS_FRONT_HOST_PORT:-24202}:80"
    depends_on:
      wavy-gateway-recette:
        condition: service_started
    networks:
      wavy-recette:
        aliases: [wavy-contrats-front]

  wavy-factures-front-recette:
    container_name: wavy-factures-front-recette
    image: ${WAVY_IMAGE_REGISTRY}/wavy-factures-front:${FACTURES_FRONT_VERSION}
    ports:
      - "${WAVY_FACTURES_FRONT_HOST_PORT:-24203}:80"
    depends_on:
      wavy-gateway-recette:
        condition: service_started
    networks:
      wavy-recette:
        aliases: [wavy-factures-front]

  wavy-tresorerie-front-recette:
    container_name: wavy-tresorerie-front-recette
    image: ${WAVY_IMAGE_REGISTRY}/wavy-tresorerie-front:${TRESORERIE_FRONT_VERSION}
    ports:
      - "${WAVY_TRESORERIE_FRONT_HOST_PORT:-24206}:80"
    depends_on:
      wavy-gateway-recette:
        condition: service_started
    networks:
      wavy-recette:
        aliases: [wavy-tresorerie-front]

  wavy-pwa-recette:
    container_name: wavy-pwa-recette
    image: ${WAVY_IMAGE_REGISTRY}/wavy-pwa:${PWA_VERSION}
    ports:
      - "${WAVY_PWA_HOST_PORT:-24204}:80"
    depends_on:
      wavy-gateway-recette:
        condition: service_started
    networks:
      - wavy-recette

networks:
  wavy-recette:
    name: wavy-recette

volumes:
  socle-postgres-recette-data:
  tiers-postgres-recette-data:
  contrats-postgres-recette-data:
  factures-postgres-recette-data:
  tresorerie-postgres-recette-data:
  contrats-pieces-jointes-recette:
