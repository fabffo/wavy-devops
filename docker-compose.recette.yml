services:
  socle-postgres:
    image: postgres:16-alpine
    container_name: socle-db-recette
    environment:
      POSTGRES_DB: ${WAVY_SOCLE_DB_NAME}
      POSTGRES_USER: ${WAVY_SOCLE_DB_USERNAME}
      POSTGRES_PASSWORD: ${WAVY_SOCLE_DB_PASSWORD}
    ports:
      - "${WAVY_SOCLE_DB_HOST_PORT}:5432"
    volumes:
      - socle-postgres-recette-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAVY_SOCLE_DB_USERNAME} -d ${WAVY_SOCLE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wavy-recette

  tiers-postgres:
    image: postgres:16-alpine
    container_name: tiers-db-recette
    environment:
      POSTGRES_DB: ${WAVY_TIERS_DB_NAME}
      POSTGRES_USER: ${WAVY_TIERS_DB_USER}
      POSTGRES_PASSWORD: ${WAVY_TIERS_DB_PASSWORD}
    ports:
      - "${WAVY_TIERS_DB_HOST_PORT}:5432"
    volumes:
      - tiers-postgres-recette-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAVY_TIERS_DB_USER} -d ${WAVY_TIERS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wavy-recette

  contrats-postgres:
    image: postgres:16-alpine
    container_name: contrats-db-recette
    environment:
      POSTGRES_DB: ${WAVY_CONTRATS_DB_NAME}
      POSTGRES_USER: ${WAVY_CONTRATS_DB_USER}
      POSTGRES_PASSWORD: ${WAVY_CONTRATS_DB_PASSWORD}
    ports:
      - "${WAVY_CONTRATS_DB_HOST_PORT}:5432"
    volumes:
      - contrats-postgres-recette-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAVY_CONTRATS_DB_USER} -d ${WAVY_CONTRATS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wavy-recette

  factures-postgres:
    image: postgres:16-alpine
    container_name: factures-db-recette
    environment:
      POSTGRES_DB: ${WAVY_FACTURES_DB_NAME}
      POSTGRES_USER: ${WAVY_FACTURES_DB_USER}
      POSTGRES_PASSWORD: ${WAVY_FACTURES_DB_PASSWORD}
    ports:
      - "${WAVY_FACTURES_DB_HOST_PORT}:5432"
    volumes:
      - factures-postgres-recette-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAVY_FACTURES_DB_USER} -d ${WAVY_FACTURES_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wavy-recette

  wavy-socle-api-recette:
    container_name: wavy-socle-api-recette
    build:
      context: ../wavy-socle-api
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      WAVY_SOCLE_DB_HOST: socle-db-recette
      WAVY_SOCLE_DB_PORT: 5432
      WAVY_SOCLE_DB_NAME: ${WAVY_SOCLE_DB_NAME}
      WAVY_SOCLE_DB_USERNAME: ${WAVY_SOCLE_DB_USERNAME}
      WAVY_SOCLE_DB_USER: ${WAVY_SOCLE_DB_USERNAME}
      WAVY_SOCLE_DB_PASSWORD: ${WAVY_SOCLE_DB_PASSWORD}
      WAVY_SOCLE_DB_URL: jdbc:postgresql://socle-db-recette:5432/${WAVY_SOCLE_DB_NAME}
      WAVY_SOCLE_API_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://socle-db-recette:5432/${WAVY_SOCLE_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${WAVY_SOCLE_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${WAVY_SOCLE_DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    ports:
      - "${WAVY_SOCLE_API_HOST_PORT}:8080"
    depends_on:
      socle-postgres:
        condition: service_healthy
    networks:
      - wavy-recette

  wavy-tiers-api-recette:
    container_name: wavy-tiers-api-recette
    build:
      context: ../wavy-tiers-api
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      WAVY_TIERS_DB_HOST: tiers-db-recette
      WAVY_TIERS_DB_PORT: 5432
      WAVY_TIERS_DB_NAME: ${WAVY_TIERS_DB_NAME}
      WAVY_TIERS_DB_USER: ${WAVY_TIERS_DB_USER}
      WAVY_TIERS_DB_USERNAME: ${WAVY_TIERS_DB_USER}
      WAVY_TIERS_DB_PASSWORD: ${WAVY_TIERS_DB_PASSWORD}
      WAVY_TIERS_API_PORT: 8081
    ports:
      - "${WAVY_TIERS_API_HOST_PORT}:8081"
    depends_on:
      tiers-postgres:
        condition: service_healthy
    networks:
      - wavy-recette

  wavy-contrats-api-recette:
    container_name: wavy-contrats-api-recette
    build:
      context: ../wavy-contrats-api
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: recette
      WAVY_CONTRATS_DB_HOST: contrats-db-recette
      WAVY_CONTRATS_DB_PORT: 5432
      WAVY_CONTRATS_DB_NAME: ${WAVY_CONTRATS_DB_NAME}
      WAVY_CONTRATS_DB_USER: ${WAVY_CONTRATS_DB_USER}
      WAVY_CONTRATS_DB_USERNAME: ${WAVY_CONTRATS_DB_USER}
      WAVY_CONTRATS_DB_PASSWORD: ${WAVY_CONTRATS_DB_PASSWORD}
      WAVY_CONTRATS_API_PORT: 8082
      WAVY_CONTRATS_STOCKAGE_PIECES_JOINTES: /app/data/contrats/pieces-jointes
    ports:
      - "${WAVY_CONTRATS_API_HOST_PORT}:8082"
    volumes:
      - contrats-pieces-jointes-recette:/app/data/contrats/pieces-jointes
    depends_on:
      contrats-postgres:
        condition: service_healthy
    networks:
      - wavy-recette

  wavy-factures-api-recette:
    container_name: wavy-factures-api-recette
    build:
      context: ../wavy-factures-api
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: recette
      WAVY_FACTURES_DB_HOST: factures-db-recette
      WAVY_FACTURES_DB_PORT: 5432
      WAVY_FACTURES_DB_NAME: ${WAVY_FACTURES_DB_NAME}
      WAVY_FACTURES_DB_USER: ${WAVY_FACTURES_DB_USER}
      WAVY_FACTURES_DB_USERNAME: ${WAVY_FACTURES_DB_USER}
      WAVY_FACTURES_DB_PASSWORD: ${WAVY_FACTURES_DB_PASSWORD}
      WAVY_FACTURES_API_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://factures-db-recette:5432/${WAVY_FACTURES_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${WAVY_FACTURES_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${WAVY_FACTURES_DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    ports:
      - "${WAVY_FACTURES_API_HOST_PORT}:8083"
    depends_on:
      factures-postgres:
        condition: service_healthy
    networks:
      - wavy-recette

  wavy-gateway-recette:
    container_name: wavy-gateway-recette
    build:
      context: ../wavy-gateway
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: recette
      WAVY_GATEWAY_PORT: 8088
      WAVY_ROUTES_SOCLE_URI: http://wavy-socle-api-recette:8080
      WAVY_TIERS_API_URI: http://wavy-tiers-api-recette:8081
      WAVY_CONTRATS_API_URI: http://wavy-contrats-api-recette:8082
      WAVY_FACTURES_API_URL: http://wavy-factures-api-recette:8083
    ports:
      - "${WAVY_GATEWAY_HOST_PORT}:8088"
    depends_on:
      wavy-socle-api-recette:
        condition: service_started
      wavy-tiers-api-recette:
        condition: service_started
      wavy-contrats-api-recette:
        condition: service_started
      wavy-factures-api-recette:
        condition: service_started
    networks:
      - wavy-recette

  wavy-socle-front-recette:
    container_name: wavy-socle-front-recette
    build:
      context: ../wavy-socle-front
      dockerfile: Dockerfile
    environment:
      API_UPSTREAM: http://wavy-gateway-recette:8088
    ports:
      - "${WAVY_SOCLE_FRONT_HOST_PORT}:80"
    depends_on:
      wavy-gateway-recette:
        condition: service_started
    networks:
      - wavy-recette

  wavy-tiers-front-recette:
    container_name: wavy-tiers-front-recette
    build:
      context: ../wavy-tiers-front
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://localhost:${WAVY_GATEWAY_HOST_PORT}
    ports:
      - "${WAVY_TIERS_FRONT_HOST_PORT}:80"
    depends_on:
      wavy-gateway-recette:
        condition: service_started
    networks:
      - wavy-recette

  wavy-contrats-front-recette:
    container_name: wavy-contrats-front-recette
    build:
      context: ../wavy-contrats-front
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://localhost:${WAVY_GATEWAY_HOST_PORT}
    ports:
      - "${WAVY_CONTRATS_FRONT_HOST_PORT}:80"
    depends_on:
      wavy-gateway-recette:
        condition: service_started
    networks:
      - wavy-recette

  wavy-factures-front-recette:
    container_name: wavy-factures-front-recette
    build:
      context: ../wavy-factures-front
      dockerfile: Dockerfile
      args:
        API_GATEWAY_BASE_URL: http://localhost:${WAVY_GATEWAY_HOST_PORT}/api
    ports:
      - "${WAVY_FACTURES_FRONT_HOST_PORT}:80"
    depends_on:
      wavy-gateway-recette:
        condition: service_started
    networks:
      - wavy-recette

networks:
  wavy-recette:
    name: wavy-recette

volumes:
  socle-postgres-recette-data:
  tiers-postgres-recette-data:
  contrats-postgres-recette-data:
  factures-postgres-recette-data:
  contrats-pieces-jointes-recette:
