# À monter uniquement après validation des quatre composants, du stockage et de l'authentification.
location = /pwa { return 308 /pwa/; }
resolver 127.0.0.11 valid=5s ipv6=off;
set $wavy_pwa_origin http://wavy-pwa-recette;
location ^~ /pwa/ {
  rewrite ^/pwa/(.*)$ /$1 break;
  proxy_pass $wavy_pwa_origin$uri$is_args$args;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $wavy_forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Cookie $http_cookie;
  # Le cache applicatif est géré par le service worker versionné ; aucun cache proxy privé.
  proxy_no_cache 1;
  proxy_cache_bypass 1;
  add_header Cache-Control 'no-cache' always;
}

# Aucun alias public pour le stockage des justificatifs.
location = /api/pwa { return 404; }
location ^~ /api/pwa/ { return 404; }
