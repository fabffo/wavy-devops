name: Preproduction validation

on:
  push:
    paths:
      - docker-compose.preprod*.yml
      - docker-compose.recette.yml
      - docker/recette-pwa/**
      - docs/pwa-recette-*.md
      - versions/recette.*
      - .env.preprod.example
      - .env.recette.example
      - versions/preprod.*
      - versions/history/preprod/**
      - scripts/**
      - wavy
      - .github/workflows/preprod-validation.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate every shell script
        run: |
          bash -n wavy
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Static PREPROD tests with fictional secrets outside repository
        run: |
          python3 scripts/test-recette-diagnostic.py
          python3 scripts/test-delivery.py
          python3 scripts/test-release-images.py
          python3 scripts/test-gateway-cors.py
          python3 scripts/test-recette-pwa.py
          python3 scripts/test-recette-documents.py
          python3 scripts/test-preprod-config.py
          python3 scripts/test-preprod-guards.py
          python3 scripts/test-preprod-nginx.py
      - name: Version history tests (temporary directory only)
        run: bash scripts/test-version-history.sh
      - name: Reject tracked PREPROD secrets and whitespace errors
        run: |
          test -z "$(git ls-files -- .env.preprod backups/preprod)"
          git check-ignore .env.preprod
          git diff --check
