# Exercice uniquement après validation. Projet séparé, aucune ressource PREPROD externe.
services:
  socle:
    image: postgres:16-alpine@sha256:93d55776e04376e19adb2733e3ccebb4392ee7dd86d8ff238503b30fe719c84f
    network_mode: none
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp, /var/run/postgresql]
    environment:
      POSTGRES_DB: ${RESTORE_SOCLE_DB:?required}
      POSTGRES_USER: ${RESTORE_SOCLE_USER:?required}
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    volumes:
      - socle-data:/var/lib/postgresql/data
      - type: bind
        source: ${RESTORE_SECRET_DIR:?absolute private directory required}/socle.password
        target: /run/secrets/db-password
        read_only: true
        bind: {create_host_path: false}
  tiers:
    image: postgres:16-alpine@sha256:93d55776e04376e19adb2733e3ccebb4392ee7dd86d8ff238503b30fe719c84f
