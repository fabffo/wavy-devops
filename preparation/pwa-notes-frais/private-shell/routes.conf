# Candidat privé : aucun marqueur livré. Aucun changement des contrôles backend.
# Résolution différée : PWA absente => seules ses requêtes échouent.
open_file_cache off;
resolver 127.0.0.11 valid=5s ipv6=off;
set $private_pwa_origin http://wavy-pwa-preprod;
location = /pwa {
  auth_request /__private_pwa_session;
  error_page 401 403 500 502 503 504 = /__private_pwa_closed;
  # return court-circuite auth_request en phase rewrite : redirection par amont interne.
  proxy_pass http://127.0.0.1:8087;
}
location ^~ /pwa/ {
  auth_request /__private_pwa_session;
  error_page 401 403 500 502 503 504 = /__private_pwa_closed;
  rewrite ^/pwa/(.*)$ /$1 break;
  proxy_pass $private_pwa_origin;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_cache off;
  add_header Cache-Control "no-store" always;
}
location = /api/pwa {
  auth_request /__private_pwa_session;
  error_page 401 403 500 502 503 504 = /__private_pwa_closed;
  client_max_body_size 64m;
  proxy_pass $private_api_origin;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_cache off;
  add_header Cache-Control "no-store" always;
}
location ^~ /api/pwa/ {
  auth_request /__private_pwa_session;
  error_page 401 403 500 502 503 504 = /__private_pwa_closed;
  client_max_body_size 64m;
  proxy_pass $private_api_origin;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_cache off;
  add_header Cache-Control "no-store" always;
}
# Aucun fichier open n'est interprété ; seul le service de session autorise.
location = /__private_pwa_session {
  internal;
  access_log off;
  proxy_pass http://unix:/run/wavy-private-pwa-gate/gate.sock:/check;
  proxy_connect_timeout 1s;
  proxy_read_timeout 1s;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Cookie $http_cookie;
  proxy_cache off;
}
location = /__private_pwa_closed {
  internal;
  add_header Cache-Control "no-store" always;
  add_header X-Wavy-Private-Gate closed always;
  return 404;
}
location = /api/notes-frais {
  error_page 418 = @private_notes_read;
  if ($request_method ~ ^(GET|HEAD)$) { return 418; }
  auth_request /__private_pwa_session;
  error_page 401 403 500 502 503 504 = /__private_notes_closed;
  client_max_body_size 64m;
  proxy_pass $private_api_origin;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  add_header Cache-Control "no-store" always;
}
location ^~ /api/notes-frais/ {
  error_page 418 = @private_notes_read;
  if ($request_method ~ ^(GET|HEAD)$) { return 418; }
  auth_request /__private_pwa_session;
  error_page 401 403 500 502 503 504 = /__private_notes_closed;
  client_max_body_size 64m;
  proxy_pass $private_api_origin;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  add_header Cache-Control "no-store" always;
}
location @private_notes_read {
  proxy_pass $private_api_origin;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  add_header Cache-Control "no-store" always;
}
location = /__private_notes_closed {
  internal;
  add_header Cache-Control "no-store" always;
  add_header X-Wavy-Private-Gate closed always;
  return 403;
}
