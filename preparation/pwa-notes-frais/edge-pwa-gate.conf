# Les APIs communes restent accessibles. Seules les écritures Notes de frais peuvent
# être fermées explicitement pour rollback/abandon ; GET/HEAD restent disponibles.
location = /api/notes-frais {
  access_log off;
  error_log /dev/null crit;
  error_page 418 = @wavy_notes_read;
  if ($request_method ~ "^(GET|HEAD)$") { return 418; }
  auth_request /__wavy_notes_write_gate;
  proxy_pass http://127.0.0.1:24443;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  add_header Cache-Control 'no-store' always;
}

location ^~ /api/notes-frais/ {
  access_log off;
  error_log /dev/null crit;
  error_page 418 = @wavy_notes_read;
  if ($request_method ~ "^(GET|HEAD)$") { return 418; }
  auth_request /__wavy_notes_write_gate;
  proxy_pass http://127.0.0.1:24443;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  add_header Cache-Control 'no-store' always;
}

location @wavy_notes_read {
  access_log off;
  error_log /dev/null crit;
  proxy_pass http://127.0.0.1:24443;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  add_header Cache-Control 'no-store' always;
}
