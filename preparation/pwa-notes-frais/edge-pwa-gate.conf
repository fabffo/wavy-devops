# Inclure dans le server HTTPS natif hôte, AVANT le fallback ERP. Pas dans Docker/Shell.
# auth_request = aucune mise en cache ; service absent/erreur/expiration => 404.
location = /__wavy_pwa_gate {
  access_log off;
  error_log /dev/null crit;
  internal;
  proxy_pass http://127.0.0.1:24444/check;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
  proxy_cache off;
}
location = /__wavy_notes_write_gate {
  access_log off;
  error_log /dev/null crit;
  internal;
  proxy_pass http://127.0.0.1:24444/notes-write;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
  proxy_cache off;
}
location = /__wavy_pwa_closed {
  access_log off;
  error_log /dev/null crit;
  internal;
  add_header X-Wavy-PWA-Gate closed always;
  add_header Cache-Control 'no-store' always;
  return 404;
}
location = /pwa {
  access_log off;
  error_log /dev/null crit;
  auth_request /__wavy_pwa_gate;
  add_header X-Wavy-PWA-Gate open always;
  error_page 401 403 500 502 503 504 = /__wavy_pwa_closed;
  proxy_pass http://127.0.0.1:24443;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  add_header Cache-Control 'no-store' always;
}
location ^~ /pwa/ {
  access_log off;
  error_log /dev/null crit;
  auth_request /__wavy_pwa_gate;
  add_header X-Wavy-PWA-Gate open always;
  error_page 401 403 500 502 503 504 = /__wavy_pwa_closed;
  proxy_pass http://127.0.0.1:24443;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  add_header Cache-Control 'no-store' always;
}
