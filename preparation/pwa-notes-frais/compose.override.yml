# CANDIDAT INACTIF. Ne pas ajouter aux commandes actives avant revue de la livraison entière.
# Les quatre variables sont des références GHCR complètes, immuables, à fournir APRÈS publication.
services:
  wavy-factures-api-preprod:
    image: ${PWA_RELEASE_FACTURES_API_IMAGE:?image vérifiée requise}
    environment:
      WAVY_FACTURES_STOCKAGE_JUSTIFICATIFS: /app/justificatifs
      WAVY_FACTURES_JUSTIFICATIF_MAX_BYTES: '10485760'
      WAVY_FACTURES_MULTIPART_MAX_FILE_SIZE: 10MB
      WAVY_FACTURES_MULTIPART_MAX_REQUEST_SIZE: 11MB
    volumes:
      - type: volume
        source: documents-preprod
        target: /app/justificatifs
        volume: {nocopy: true, subpath: notes-frais}
  wavy-pwa-preprod:
    image: ${PWA_RELEASE_PWA_IMAGE:?image vérifiée requise}
  wavy-factures-front-preprod:
    image: ${PWA_RELEASE_FACTURES_FRONT_IMAGE:?image vérifiée requise}
  wavy-erp-shell-preprod:
    image: ${PWA_RELEASE_ERP_SHELL_IMAGE:?image vérifiée requise}
    # Fermeture explicite même si le Shell précédent avait déjà été activé.
    volumes:
      - type: bind
        source: ${WAVY_PWA_CANDIDATE_DIR:?répertoire candidat absolu requis}/nginx-pwa-disabled.conf
        target: /etc/nginx/pwa-route.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${WAVY_PWA_CANDIDATE_DIR:?répertoire candidat absolu requis}/pwa-integration.disabled.json
        target: /usr/share/nginx/html/pwa-integration.json
        read_only: true
        bind: {create_host_path: false}
    # Défense au démarrage seulement : release-preprod.sh utilise --no-deps.
    depends_on:
      wavy-factures-api-preprod: {condition: service_healthy}
      wavy-factures-front-preprod: {condition: service_healthy}
      wavy-pwa-preprod: {condition: service_healthy}
